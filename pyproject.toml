[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "jobby-hermes"
version = "0.1.0"
description = "Source-backed local application materials for an external Hermes operator"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2,<3", "fastapi>=0.110,<1", "PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "reportlab>=4,<6", "python-jobspy>=1.4.1,<2"]

[project.optional-dependencies]
discovery = ["python-jobspy>=1.4.1,<2"]
dashboard = ["uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "Pillow>=10,<13"]

[project.scripts]
jobby = "personal_jobby.__main__:main"

[tool.setuptools.packages.find]
include = ["personal_jobby*"]

[tool.setuptools.package-data]
personal_jobby = ["static/*", "skills/*/SKILL.md", "*.md"]
